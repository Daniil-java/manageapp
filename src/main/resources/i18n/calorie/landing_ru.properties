# ── Вопросы ────────────────────────────────────────────────────
landing.faq.eyebrow=Вопросы
landing.faq.title=Частые вопросы
landing.faq.install-q=Нужно что-то устанавливать?
landing.faq.install-a=Нет. Zefir работает внутри Telegram: открываешь бота, нажимаешь «Старт» — и можно отправлять еду. Мини-приложение открывается кнопкой в самом боте.
landing.faq.accuracy-q=Насколько точно ИИ считает калории?
landing.faq.accuracy-a=Для обычных блюд оценка близка к тому, что дают таблицы калорийности. Вес порции по фото — приблизительный, поэтому его легко поправить кнопками ±10% или текстом. Чем понятнее фото и подпись («2 яйца, жарил на масле»), тем точнее результат.
landing.faq.premium-q=Чем Premium отличается от бесплатной версии?
landing.faq.premium-a=В бесплатной версии фото-разборы и ИИ-разбор дня ограничены несколькими в день, а избранное — несколькими блюдами. Premium снимает эти лимиты и открывает PDF-отчёты за неделю и месяц. Точные цифры — в таблице тарифов.
landing.faq.pay-q=Как оплатить подписку?
landing.faq.pay-a=В боте нажми «💳 Подписка» и выбери тариф. Оплата идёт через Telegram Stars — звёзды можно купить прямо в Telegram.
landing.faq.norm-q=Как считается моя норма?
landing.faq.norm-a=По формуле Миффлина — Сан-Жеора с поправкой на активность и цель — как в калькуляторе выше. Белок — от веса, жиры — около 25% калорий, остальное — углеводы. Норму можно задать и вручную.
landing.faq.data-q=Что с моими данными?
landing.faq.data-a=Какие данные хранятся и зачем, описано в <a href="/calorie/privacy?lang=ru">политике конфиденциальности</a>.

