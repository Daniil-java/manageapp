# User-facing error texts — English. Key: error.<ErrorStatus> (ErrorStatus.getTextKey()).
# Named arguments — same names as the exception params and the API response:
#   {min} / {max} — count/characters/minutes limits, {maxSizeMb} — size limit in MB, {formats} — allowed formats,
#   {waitHours} + {waitMinutes} — when to retry, {dailyLimit} — daily AI limit.

# ── Access and profile ─────────────────────────────────────────
error.MISSING_FEATURE=This feature is available with a subscription.
error.PROFILE_INSUFFICIENT_DATA=Not enough data to calculate — fill in your profile.
error.USER_NUTRITION_PROFILE_VALIDATION_EXCEPTION=Invalid value.
error.USER_NOT_FOUND=User not found.
error.SITE_ACCESS_DENIED=The site is in closed testing. Access is by invitation only.

# ── Settings ───────────────────────────────────────────────────
error.INVALID_TIMEZONE=Unknown time zone.
error.INVALID_DAILY_SUMMARY_HOUR=The report hour must be from 0 to 23.
error.INVALID_MEAL_REMINDER_INTERVAL=The reminder interval must be from {min} to {max} minutes.

# ── Dishes and favorites ───────────────────────────────────────
error.DISH_NOT_FOUND=Couldn't find this dish. It may have been deleted.
error.DISH_EMPTY_FOOD_DESCRIPTION=Describe what you ate.
error.DISH_NOT_BELONG_USER=This dish belongs to another user.
error.FAVORITE_DISH_ALREADY_EXISTS=A dish with this name is already in your favorites.
error.FAVORITE_DISH_NOT_FOUND=Couldn't find this dish in your favorites.
error.QUICK_ADD_FULL=Quick add is full. Unpin a dish first.
error.DISH_SAVE_FAILED=⚠️ Couldn't save the dish — something went wrong on our side, this attempt wasn't counted. Please try again a bit later.
error.AI_UNAVAILABLE=⚠️ AI isn't responding right now — something went wrong on our side. Please try again in a couple of minutes.
error.DISH_DAILY_LIMIT=Too many dishes added in the last 24 hours (max {max}). Try again later.

# ── Payment ────────────────────────────────────────────────────
error.PAYMENT_FAILED=Payment failed.
error.PAYMENT_TELEGRAM_REQUIRED=Payment is available only in Telegram. Open the app in Telegram.
error.PRICING_PLAN_NOT_AVAILABLE=This plan is not available.

# ── Site sign-in ───────────────────────────────────────────────
error.EMAIL_ALREADY_BUSY=This email is already taken.
error.EMAIL_AUTH_DISABLED=Sign-up and sign-in with email are temporarily unavailable. Sign in with Telegram.
error.AUTH_RATE_LIMIT=Too many attempts. Try again in {waitHours, plural, =0{{waitMinutes, plural, one{# minute} other{# minutes}}} one{# hour} other{# hours}}{waitHours, plural, =0{} other{{waitMinutes, plural, =0{} one{ # minute} other{ # minutes}}}}.

# ── AI reports ─────────────────────────────────────────────────
error.AI_INSIGHT_TOO_FREQUENT=The report was updated just now. Try again in a minute.
error.AI_INSIGHT_FAILED=AI couldn't build the report. Try again later.
error.AI_INSIGHT_NOT_ENOUGH_DATA=Not enough data yet. Log your meals for at least 3 days.

# ── AI input: text, photo, voice ───────────────────────────────
error.TEXT_TOO_LONG=Text is too long. Maximum is {max, plural, one{# character} other{# characters}}.
error.PHOTO_COMMENT_TOO_LONG=Photo comment is too long. Maximum is {max, plural, one{# character} other{# characters}}.
error.IMAGE_TOO_LARGE=Photo is too large. Maximum is {maxSizeMb} MB.
error.UNSUPPORTED_IMAGE_FORMAT=This photo format isn't supported. Allowed: {formats}.
error.AUDIO_TOO_LARGE=Voice message is too long. Maximum is {maxSizeMb} MB (about {maxDurationMinutes} min).
error.UNSUPPORTED_AUDIO_FORMAT=This audio format isn't supported. Allowed: {formats}.
error.INVALID_FILE=The file is damaged. Try another one.
error.REQUEST_TOO_LARGE=The file is too large. Maximum is {maxSizeMb} MB.
error.PHOTO_NOT_RECOGNIZED_NOT_COUNTED=🤔 No food found in the photo.\n\nThis scan wasn't counted, but the next unrecognized photo today will be. Take a clear, close-up photo of the dish in good light or describe it in text.
error.PHOTO_NOT_RECOGNIZED_COUNTED=🤔 No food found in the photo. This scan was counted.\n\nTake a clear, close-up photo of the dish in good light or describe it in text.

# ── AI limits ──────────────────────────────────────────────────
error.AI_RATE_LIMIT=Too many AI requests. Try again in {retryAfterSeconds, plural, one{# second} other{# seconds}}.
error.AI_DAILY_LIMIT=Daily AI limit reached ({dailyLimit} per day). Try again in {waitHours, plural, =0{{waitMinutes, plural, one{# minute} other{# minutes}}} one{# hour} other{# hours}}{waitHours, plural, =0{} other{{waitMinutes, plural, =0{} one{ # minute} other{ # minutes}}}}.
