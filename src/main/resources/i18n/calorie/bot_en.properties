# /start (StartUpdateHandler) — two messages. The first one with the reply keyboard: start.welcome, trial line,
# partner bonus, start.legal. The second one, last, is the call to log a meal (start.first-dish-call) with
# "See an example" and "What else I can do" buttons. The goal is the first dish; channel, invites and profile come
# after it (FirstDishFollowUpSender). HTML
start.welcome=👋 Hi! I count calories and macros of what you eat — from a photo, text or voice message, right in Telegram.
# {0} — trial days
start.welcome.trial=🎁 <b>{0, plural, one{# day} other{# days}} of Premium</b> — free, already on.
# Language taken from Telegram without asking. {0} — the language name in that language
start.language-auto=🌐 Language: {0} — change: /lang
start.first-dish-call=<b>Log your first meal right now</b> — any way you like:\n\
📸 snap your plate\n\
📝 type: "oatmeal with banana and coffee"\n\
🎙 or say it in a voice message\n\
\n\
See what an entry looks like 👇
start.button.sample=👀 See an example
start.button.more=📋 What else I can do
# "See an example" button (SampleDishCalorieUpdateHandler): sample dish card with a progress bar against a sample target,
# its buttons work on the sample itself; then start.sample.after (no profile yet, "Fill in profile" button)
# or start.sample.after.profile-filled. HTML
start.sample.dish-name=Oatmeal with banana and coffee
start.sample.after=☝️ This is what an entry looks like. Try the buttons below it: weight and portions recalculate the calories and the bar.\n\
It's just an example — it's not in your diary, and the bar uses a sample target of 2000 kcal.\n\
\n\
📊 <b>Fill in your profile</b> — I'll work out your daily calorie and macro targets for your goal, and the bars will show your progress for the day.\n\
\n\
<b>Your turn:</b> send a photo of your plate, or type or say what you're eating 🙂
start.sample.after.profile-filled=☝️ This is what an entry looks like. Try the buttons below it: weight and portions recalculate the calories and the bar.\n\
It's just an example — it's not in your diary, and the bar uses a sample target of 2000 kcal. Yours will follow your profile.\n\
\n\
<b>Your turn:</b> send a photo of your plate, or type or say what you're eating 🙂
