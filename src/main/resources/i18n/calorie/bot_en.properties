intro.button.profile=🎯 Profile and goal
intro.button.reminders=🔔 Reminders
intro.button.reports=📄 Analytics
intro.button.premium=⭐ Premium
intro.button.rewards=🎁 Rewards
intro.button.channel=📢 Channel
intro.button.faq=📖 Guide
intro.button.back=← To sections
intro.button.open-channel=📢 Open the channel
intro.food=🍽 <b>How to log food</b>\n\
\n\
Just send to the chat:\n\
📸 a <b>photo</b> of your plate — AI recognizes the dish and estimates the portion\n\
📝 <b>text</b> — for example, "two eggs, toast and coffee with milk"\n\
🎙 a <b>voice message</b> — I'll transcribe and count it myself\n\
\n\
Under the dish card you can adjust the weight and number of portions, add the dish to ⭐ Favorites — then it's logged in one tap — or delete it.\n\
\n\
Everything you ate today is in "📊 Today".
intro.profile.empty=🎯 <b>Profile and goal</b> — ⚠️ not filled in\n\
\n\
Tell me a bit about yourself and your goal — I'll calculate your daily calorie and macro targets. Then instead of bare numbers you'll see progress bars: how much you can still eat today 📊
intro.profile.filled=🎯 <b>Profile and goal</b> — ✅ filled in\n\
\n\
I use your profile to calculate your daily calorie and macro targets and show your progress for the day. Weight or goal changed — update the profile and the targets will be recalculated.
intro.reminders=🔔 <b>Reminders and daily summary</b>\n\
\n\
🍽 No meals logged for a while — I'll remind you so nothing gets lost.\n\
📊 In the evening I'll send a daily summary: how much you ate compared to your target.\n\
\n\
Summary time, reminder interval and time zone are in ⚙️ Settings. You can turn everything off there too.
intro.reports=📄 <b>Analytics</b>\n\
\n\
Daily, weekly and monthly reports plus weight trends — to see the real picture, not guesses.\n\
\n\
💎 Premium adds an AI review of your day and a PDF analysis of your diet and eating habits.
start.flow.button.fill-profile=Fill in profile

