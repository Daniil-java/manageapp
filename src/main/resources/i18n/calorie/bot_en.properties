# /start (StartUpdateHandler). HTML. The channel is Russian-only for now (see backlog).
start.welcome=Welcome! 👋 I turn food photos into accurate calorie and macro data. Forget manual logging and kitchen scales: just snap your plate and you'll instantly see your progress on handy charts and bars. It's the fastest way to stay in shape!\n\
\n\
By the way, I run the ZEFIR channel about nutrition and AI (in Russian). We debunk diet myths, share science-based facts and play "Guess the calories from a photo". Subscribe for lots of value and a bit of humor: @zephyr_ai\n\
\n\
By using the bot, you accept the <a href="https://kuklin.dev/calorie/privacy">Privacy Policy</a> and the <a href="https://kuklin.dev/calorie/terms">Terms of Service</a>.

# Intro after "Next" (StartFlowCalorieUpdateHandler)
start.flow.intro=Hi! 👋 I'm your smart calorie-tracking assistant and food diary.\n\
\n\
How do you log food? It's easy:\n\
Text 📝: just type it in the chat (for example: "two boiled eggs, toast and coffee with milk").\n\
Voice 🎙: too lazy to type? Say what you ate in a voice message — I'll transcribe and count everything.\n\
Photo 📸: send a photo of your plate, and my AI will recognize the dish and estimate the portion.\n\
\n\
Handy commands that are always at hand:\n\
/menu — open the main menu with buttons right in the chat.\n\
/keyboard — bring the menu keyboard back to the bottom of the screen if it disappeared.\n\
/support — contact our support (if you have questions or something went wrong).
start.flow.fill-profile=Step 1. Fill in your profile\n\
Please tap the "Fill in profile" button below this message. I need it to calculate your personal daily target. Once you do, you'll get nice, handy progress bars for calories and macros instead of boring numbers! 📊
start.flow.button.fill-profile=Fill in profile

