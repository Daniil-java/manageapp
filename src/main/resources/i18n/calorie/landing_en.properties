# ── FAQ ────────────────────────────────────────────────────────
landing.faq.eyebrow=FAQ
landing.faq.title=Frequently asked questions
landing.faq.install-q=Do I need to install anything?
landing.faq.install-a=No. Zefir works inside Telegram: open the bot, tap «Start» — and you can send food. The mini app opens with a button in the bot itself.
landing.faq.accuracy-q=How accurate are the AI's calorie counts?
landing.faq.accuracy-a=For everyday dishes the estimate is close to what calorie tables give. Portion weight from a photo is approximate, so it's easy to adjust with the ±10% buttons or in text. The clearer the photo and caption («2 eggs, fried in oil»), the more accurate the result.
landing.faq.premium-q=How is Premium different from the free version?
landing.faq.premium-a=In the free version, photo breakdowns and the AI day review are limited to a few a day, and favorites to a few dishes. Premium removes these limits and unlocks weekly and monthly PDF reports. Exact numbers are in the pricing table.
landing.faq.pay-q=How do I pay for a subscription?
landing.faq.pay-a=In the bot, tap «💳 Subscription» and choose a plan. Payment goes through Telegram Stars — you can buy stars right in Telegram.
landing.faq.norm-q=How is my target calculated?
landing.faq.norm-a=With the Mifflin — St Jeor formula, adjusted for activity and goal — just like the calculator above. Protein is based on weight, fat is about 25% of calories, the rest is carbs. You can also set the target manually.
landing.faq.data-q=What about my data?
landing.faq.data-a=What data is stored and why is described in the <a href="/calorie/privacy?lang=en">privacy policy</a>.

