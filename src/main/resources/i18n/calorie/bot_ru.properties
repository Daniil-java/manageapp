# Тексты калорийного бота — русский. Ключи — константы в BotTextKeys.
# Шаблоны ICU MessageFormat: {0} — подстановка; склонения: {0, plural, one{# день} few{# дня} many{# дней} other{# дня}}

# /lang (только для разработчиков)
dev.lang.current=🌐 Язык: {0}. Доступны: {1}\nСменить: /lang en, сбросить выбор: /lang reset
dev.lang.current-default=🌐 Язык: {0} (по умолчанию, не выбран). Доступны: {1}\nСменить: /lang en, сбросить выбор: /lang reset
dev.lang.changed=🌐 Язык переключён: {0}
dev.lang.reset=🌐 Выбор языка сброшен, теперь язык по умолчанию: {0}
dev.lang.unknown=Не знаю язык «{0}». Доступны: {1}

