# /start (StartUpdateHandler). HTML.
start.welcome=Добро пожаловать! 👋 Я превращаю фото еды в точные данные о калориях и БЖУ. Забудь о ручном вводе и весах: просто сфотографируй тарелку — и ты сразу увидишь свой прогресс на удобных графиках и шкалах. Это самый быстрый способ держать форму под контролем!\n\
\n\
Кстати, я запустил канал ЗЕФИР, где рассказываю о питании и ИИ. Там мы разбираем мифы о диетах, делимся научными фактами и играем в интерактивы «Угадай КБЖУ по фото». Подписывайся, там много пользы и немного юмора: @zephyr_ai (или ссылка на канал).\n\
\n\
Начиная работу с ботом, вы принимаете условия <a href="https://kuklin.dev/calorie/privacy">Политики конфиденциальности</a> и <a href="https://kuklin.dev/calorie/terms">Пользовательского соглашения</a>.

# Знакомство после «Далее» (StartFlowCalorieUpdateHandler)
start.flow.intro=Привет! 👋 Я — твой умный помощник для учета калорий и дневник питания.\n\
\n\
Как записывать еду? Это очень просто:\n\
Текстом 📝: Просто напиши в чат (например: «два вареных яйца, тост и кофе с молоком»).\n\
Голосом 🎙: Лень печатать? Наговори съеденное в голосовом сообщении — я сам всё расшифрую и посчитаю.\n\
По фото 📸: Отправь фотографию своей тарелки, а мой ИИ распознает блюдо и оценит порцию.\n\
\n\
Полезные команды, которые всегда под рукой:\n\
/menu — вызов главного меню с кнопками прямо в чате.\n\
/keyboard — вернуть меню-клавиатуру в самый низ экрана, если она пропала.\n\
/support — написать в нашу поддержку (если есть вопросы или что-то пошло не так).
start.flow.fill-profile=Шаг 1. Заполни профиль\n\
Пожалуйста, нажми на кнопку «Заполнить профиль» под этим сообщением. Это нужно, чтобы я рассчитал твою личную суточную норму. Как только ты это сделаешь, у тебя появятся красивые и удобные шкалы прогресса по калориям и БЖУ вместо скучных цифр! 📊
start.flow.button.fill-profile=Заполнить профиль

