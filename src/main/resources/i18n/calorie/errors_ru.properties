# Тексты ошибок для пользователя — русский. Ключ: error.<ErrorStatus> (ErrorStatus.getTextKey()).
# Подстановки именованные — те же имена, что в params исключения и в ответе API:
#   {min} / {max} — пределы в штуках/символах/минутах, {maxSizeMb} — лимит размера в МБ, {formats} — допустимые форматы,
#   {waitHours} + {waitMinutes} — через сколько повторить, {dailyLimit} — суточный лимит ИИ.

# ── Доступ и профиль ───────────────────────────────────────────
error.MISSING_FEATURE=Эта функция доступна по подписке.
error.PROFILE_INSUFFICIENT_DATA=Не хватает данных для расчёта — заполните профиль.
error.USER_NUTRITION_PROFILE_VALIDATION_EXCEPTION=Неверное значение.
error.USER_NOT_FOUND=Пользователь не найден.
error.SITE_ACCESS_DENIED=Сайт в закрытом тестировании. Вход только по приглашению.

# ── Настройки ──────────────────────────────────────────────────
error.INVALID_TIMEZONE=Не знаю такой часовой пояс.
error.INVALID_DAILY_SUMMARY_HOUR=Час отчёта — от 0 до 23.
error.INVALID_MEAL_REMINDER_INTERVAL=Интервал напоминаний — от {min} до {max} минут.

# ── Блюда и избранное ──────────────────────────────────────────
error.DISH_NOT_FOUND=Не нашёл это блюдо. Возможно, оно было удалено.
error.DISH_EMPTY_FOOD_DESCRIPTION=Опишите, что вы съели.
error.DISH_NOT_BELONG_USER=Это блюдо принадлежит другому пользователю.
error.FAVORITE_DISH_ALREADY_EXISTS=Блюдо с таким названием уже есть в сохранённых.
error.FAVORITE_DISH_NOT_FOUND=Не нашёл это блюдо в сохранённых.
error.QUICK_ADD_FULL=Все места для быстрого добавления заняты. Сначала открепите какое-нибудь блюдо.
error.DISH_SAVE_FAILED=⚠️ Не получилось сохранить блюдо — сбой на нашей стороне, попытка не засчитана. Попробуйте ещё раз чуть позже.
error.AI_UNAVAILABLE=⚠️ ИИ сейчас не отвечает. Попробуйте ещё раз через пару минут.
error.DISH_DAILY_LIMIT=Слишком много блюд за последние 24 часа (максимум {max}). Попробуйте позже.

# ── Оплата ─────────────────────────────────────────────────────
error.PAYMENT_FAILED=Оплата не прошла.
error.PAYMENT_TELEGRAM_REQUIRED=Оплата доступна только в Telegram. Откройте приложение в Telegram.
error.PRICING_PLAN_NOT_AVAILABLE=Этот тариф недоступен.

# ── Вход на сайт ───────────────────────────────────────────────
error.EMAIL_ALREADY_BUSY=Этот email уже занят.
error.EMAIL_AUTH_DISABLED=Регистрация и вход по email временно недоступны. Войдите через Telegram.
error.AUTH_RATE_LIMIT=Слишком много попыток. Попробуйте через {waitHours, plural, =0{{waitMinutes, plural, one{# минуту} few{# минуты} many{# минут} other{# минуты}}} one{# час} few{# часа} many{# часов} other{# часа}}{waitHours, plural, =0{} other{{waitMinutes, plural, =0{} one{ # минуту} few{ # минуты} many{ # минут} other{ # минуты}}}}.

# ── ИИ-отчёты ──────────────────────────────────────────────────
error.AI_INSIGHT_TOO_FREQUENT=Отчёт только что обновлялся. Попробуйте через минуту.
error.AI_INSIGHT_FAILED=ИИ не смог построить отчёт. Попробуйте позже.
error.AI_INSIGHT_NOT_ENOUGH_DATA=Пока мало данных. Записывайте еду хотя бы 3 дня.

# ── Ввод для ИИ: текст, фото, голос ────────────────────────────
error.TEXT_TOO_LONG=Слишком длинный текст. Максимум — {max, plural, one{# символ} few{# символа} many{# символов} other{# символа}}.
error.PHOTO_COMMENT_TOO_LONG=Слишком длинный комментарий к фото. Максимум — {max, plural, one{# символ} few{# символа} many{# символов} other{# символа}}.
error.IMAGE_TOO_LARGE=Фото слишком большое. Максимум — {maxSizeMb} МБ.
error.UNSUPPORTED_IMAGE_FORMAT=Этот формат фото не поддерживается. Подойдут: {formats}.
error.AUDIO_TOO_LARGE=Голосовое слишком длинное. Максимум — {maxSizeMb} МБ (около {maxDurationMinutes} мин).
error.UNSUPPORTED_AUDIO_FORMAT=Этот формат аудио не поддерживается. Подойдут: {formats}.
error.INVALID_FILE=Файл повреждён. Попробуйте другой.
error.REQUEST_TOO_LARGE=Файл слишком большой. Максимум — {maxSizeMb} МБ.
error.PHOTO_NOT_RECOGNIZED_NOT_COUNTED=🤔 Не удалось найти еду на фото.\n\nВ этот раз попытку не засчитали, но следующее нераспознанное фото сегодня уже будет засчитано. Фотографируйте блюдо крупно и при хорошем свете или опишите его текстом.
error.PHOTO_NOT_RECOGNIZED_COUNTED=🤔 Не удалось найти еду на фото. Попытка засчитана.\n\nФотографируйте блюдо крупно и при хорошем свете или опишите его текстом.

# ── Лимиты ИИ ──────────────────────────────────────────────────
error.AI_RATE_LIMIT=Слишком много запросов к ИИ. Попробуйте через {retryAfterSeconds, plural, one{# секунду} few{# секунды} many{# секунд} other{# секунды}}.
error.AI_DAILY_LIMIT=Дневной лимит ИИ исчерпан ({dailyLimit} в сутки). Попробуйте через {waitHours, plural, =0{{waitMinutes, plural, one{# минуту} few{# минуты} many{# минут} other{# минуты}}} one{# час} few{# часа} many{# часов} other{# часа}}{waitHours, plural, =0{} other{{waitMinutes, plural, =0{} one{ # минуту} few{ # минуты} many{ # минут} other{ # минуты}}}}.
