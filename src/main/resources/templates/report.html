<!DOCTYPE html>
<html lang="{{LANG}}" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8"/>
    <title>{{TITLE}}</title>
    <style>
        /* Текст страницы — шрифты из ReportService (Nunito, запасные Noto Emoji и DejaVu Sans).
           Batik рисует текст SVG-графиков только шрифтами из @font-face; жирный по весу он не подбирает — отдельное семейство.
           classpath: — ресурсы приложения, протокол регистрирует ReportService */
        @font-face { font-family: "Nunito"; src: url("classpath:/fonts/Nunito-Regular.ttf"); }
        @font-face { font-family: "Nunito ExtraBold"; src: url("classpath:/fonts/Nunito-ExtraBold.ttf"); }

        /* Цвета — светлая тема мини-приложения (zef-fe globals.css), те же значения в ReportPalette */
        @page {
            size: A4;
            margin: 13mm 14mm 17mm 14mm;
            background-color: #FDFBF7;

            @bottom-left {
                content: element(footer);
                vertical-align: top;
                border-top: 1px solid #EFE6D9;
            }
            @bottom-right {
                content: "{{pdf.page}} " counter(page) " {{pdf.page-of}} " counter(pages);
                vertical-align: top;
                text-align: right;
                padding-top: 6px;
                border-top: 1px solid #EFE6D9;
                font-family: "Nunito", "DejaVu Sans";
                font-size: 7.5pt;
                font-weight: 700;
                color: #8A7A70;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Nunito", "Noto Emoji", "DejaVu Sans";
            font-size: 9.5pt;
            line-height: 1.45;
            color: #3E2723;
        }

        #footer {
            position: running(footer);
            padding-top: 6px;
            font-size: 7.5pt;
            font-weight: 700;
            color: #8A7A70;
        }
        #footer svg { display: inline-block; width: 14px; height: 13px; vertical-align: -3px; margin-right: 5px; }

        table { border-collapse: collapse; }
        .mut { color: #8A7A70; }
        .page-break { page-break-after: always; }
        .block { page-break-inside: avoid; }
        .gap { margin-top: 12px; }

        /* Сетки карточек: отступ между ячейками — border-spacing, а обёртка .row съедает его по краям */
        .row { margin: -8px; }
        .row-sm { margin: -4px; }
        .grid, .pats { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 8px; }
        .grid > tbody > tr > td, .grid > tr > td { vertical-align: top; padding: 0; }

        .card {
            background-color: #FFFFFF;
            border: 1px solid #EFE6D9;
            border-bottom: 3px solid #FBE7D9;
            border-right: 3px solid #FBE7D9;
            border-radius: 18px;
            padding: 12px 14px;
        }
        .card-title { font-weight: 900; font-size: 10pt; margin-bottom: 6px; }

        /* Обложка */
        .cover-top { width: 100%; }
        .cover-top td { vertical-align: middle; }
        .mascot { width: 76px; }
        .mascot svg { width: 66px; height: 62px; }
        .brand { font-size: 10pt; font-weight: 800; color: #D97A4A; letter-spacing: 0.5px; text-transform: uppercase; }
        h1 { margin: 0; font-size: 25pt; font-weight: 900; line-height: 1.1; }
        .period { color: #8A7A70; font-size: 10.5pt; font-weight: 700; }
        .cover-meta { text-align: right; font-size: 8.5pt; color: #8A7A70; width: 120px; }
        .cover-meta b { color: #3E2723; }
        .chips { margin: 12px 0 14px; }
        .tag {
            display: inline-block;
            background-color: #FBF6EE;
            border: 1px solid #EFE6D9;
            border-radius: 99px;
            padding: 3px 10px;
            margin: 0 5px 5px 0;
            font-size: 8.5pt;
            font-weight: 700;
        }
        .tag b { color: #D97A4A; }
        .headline { background-color: #FBE7D9; border-radius: 18px; padding: 13px 16px; margin-bottom: 14px; }
        .headline .lbl { font-size: 7.5pt; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; color: #D97A4A; }
        .headline .txt { font-size: 13pt; font-weight: 800; line-height: 1.3; margin-top: 2px; }

        .kpi {
            background-color: #FFFFFF;
            border: 1px solid #EFE6D9;
            border-bottom: 3px solid #FBE7D9;
            border-right: 3px solid #FBE7D9;
            border-radius: 18px;
            padding: 10px 12px 11px;
            height: 104px;
            position: relative;
        }
        .kpi-e { position: absolute; right: 11px; top: 9px; font-size: 14pt; color: #D97A4A; }
        .kpi-v { font-size: 19pt; font-weight: 900; line-height: 1.1; margin-top: 4px; }
        .kpi-v small { font-size: 9pt; font-weight: 700; color: #8A7A70; margin-left: 3px; }
        .kpi-l { font-size: 8.5pt; color: #8A7A70; font-weight: 700; }
        .chip { display: inline-block; margin-top: 6px; font-size: 7.5pt; font-weight: 800; border-radius: 99px; padding: 2px 8px; }
        .chip.good { background-color: #E6F3E2; color: #4F7F4E; }
        .chip.warn { background-color: #FBE7D9; color: #C96A3A; }
        .chip.neutral { background-color: #FBF6EE; color: #8A7A70; }

        /* Заголовки разделов */
        .sec { margin: 16px 0 8px; page-break-after: avoid; }
        h2 { margin: 0; font-size: 13pt; font-weight: 900; }
        .se {
            display: inline-block;
            width: 26px;
            height: 26px;
            line-height: 26px;
            text-align: center;
            border-radius: 9px;
            background-color: #FBE7D9;
            margin-right: 8px;
            font-size: 11pt;
            color: #D97A4A;
        }
        .note { color: #8A7A70; font-size: 8.5pt; margin: 2px 0 0 34px; }
        .ai-badge {
            display: inline-block;
            font-size: 7pt;
            font-weight: 800;
            letter-spacing: 0.6px;
            background-color: #3E2723;
            color: #FDFBF7;
            border-radius: 99px;
            padding: 1px 7px;
            margin-left: 8px;
            vertical-align: 2px;
        }

        /* Календарь */
        .heat { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 4px; }
        .heat th { font-size: 8pt; color: #8A7A70; font-weight: 700; padding: 0 0 1px; }
        .heat td { height: 44px; border-radius: 11px; padding: 5px 7px; vertical-align: top; }
        .heat .hd { font-size: 8pt; font-weight: 800; }
        .heat .hk { font-size: 8pt; margin-top: 3px; white-space: nowrap; }
        .heat .hk b { font-size: 9.5pt; }
        .heat td.none { background-color: #FBF6EE; border: 1.5px dashed #C9BCB2; color: #8A7A70; }
        .heat td.none .hk { font-size: 7.5pt; }
        .heat td.outside { border: 1px solid #EFE6D9; color: #C9BCB2; }
        .legend { margin-top: 8px; font-size: 8pt; color: #8A7A70; }
        .legend span { display: inline-block; margin-right: 12px; }
        .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
        .legend i.dash { border: 1.5px dashed #C9BCB2; background-color: #FBF6EE; }

        /* Цифры под графиками */
        .stats { width: 100%; table-layout: fixed; margin-top: 6px; }
        .stats td { padding: 2px 0; vertical-align: top; }
        .stat-v { font-size: 13pt; font-weight: 900; }
        .stat-v small { font-size: 8.5pt; color: #8A7A70; font-weight: 700; }
        .stat-l { font-size: 8pt; color: #8A7A70; font-weight: 700; }

        /* Реальный расход */
        .tdee { background-color: #3E2723; color: #FDFBF7; border-radius: 18px; padding: 14px 16px; }
        .tdee .lbl { font-size: 7.5pt; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; color: #F6D9C2; }
        .tdee .big { font-size: 24pt; font-weight: 900; line-height: 1.1; }
        .tdee .big small { font-size: 10pt; color: #F6D9C2; }
        .tdee .txt { font-size: 8.8pt; color: #E9DCCF; margin-top: 4px; }
        .tdee .how { font-size: 8pt; color: #C9BCB2; margin-top: 6px; }

        .cmp { width: 100%; }
        .cmp td { padding: 3px 0; font-size: 8.5pt; vertical-align: middle; }
        .cmp .cl { width: 62px; }
        .cmp .cv { width: 52px; text-align: right; }
        .cmp .track { height: 9px; border-radius: 4.5px; }

        .callout { background-color: #FBF6EE; border-radius: 12px; padding: 8px 11px; font-size: 8.8pt; margin-top: 8px; }
        .callout b { color: #D97A4A; }
        .callout.flat { margin-top: 0; }
        .callout.empty { font-size: 11pt; padding: 16px; margin-top: 16px; }

        /* Полоски */
        .track { background-color: #F5EFE6; border-radius: 5px; height: 10px; overflow: hidden; }
        .fillb { height: 100%; border-radius: 5px; }

        /* БЖУ */
        .split { width: 100%; }
        .split td { vertical-align: middle; }
        .split .donut { width: 185px; }
        .macros { width: 100%; }
        .macros td { padding: 5px 0; vertical-align: middle; }
        .macros .mn { width: 86px; font-weight: 800; }
        .macros .mn i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; }
        .macros .mb { padding-right: 10px; }
        .macros .mv { width: 92px; text-align: right; font-size: 8.5pt; color: #8A7A70; }
        .macros .mv b { color: #3E2723; font-size: 10pt; }
        .macros .mp { width: 44px; text-align: right; font-weight: 900; font-size: 9pt; }
        .good { color: #4F7F4E; }
        .warn { color: #C96A3A; }
        .bad { color: #B8442A; }

        /* Топы и категории */
        .card.fill { height: 100%; }
        .top { width: 100%; }
        .top td { padding: 4px 0; border-bottom: 1px solid #EFE6D9; font-size: 9pt; }
        .top .te { width: 24px; font-size: 10pt; color: #D97A4A; }
        .top .tv { text-align: right; font-weight: 800; white-space: nowrap; padding-left: 6px; }
        .top .tv small { color: #8A7A70; font-weight: 700; }
        .cat { width: 100%; }
        .cat td { padding: 3px 0; font-size: 8.5pt; vertical-align: middle; }
        .cat .cn { width: 130px; font-weight: 700; }
        .cat .cp { width: 40px; text-align: right; font-weight: 800; color: #8A7A70; }

        /* Паттерны ИИ: стиль карточки на самой ячейке — соседние карточки ряда всегда одной высоты */
        .pats td {
            width: 50%;
            vertical-align: top;
            background-color: #FFFFFF;
            border: 1px solid #EFE6D9;
            border-left: 5px solid #C9BCB2;
            border-radius: 16px;
            padding: 10px 12px;
        }
        .pats td.pos { border-left-color: #7FB77E; }
        .pats td.neg { border-left-color: #D97A4A; }
        .pats td.empty { background-color: transparent; border: none; }
        .pat-h { font-weight: 900; font-size: 10pt; }
        .pat-e { margin-right: 6px; color: #D97A4A; }
        .pat-t { font-size: 8.6pt; margin-top: 3px; }
        .pat-i { font-size: 8pt; margin-top: 5px; font-weight: 800; }
        .pos .pat-i { color: #4F7F4E; }
        .neg .pat-i { color: #C96A3A; }
        .neu .pat-i { color: #8A7A70; }

        .swaps { width: 100%; }
        .swaps td { padding: 7px 4px; border-bottom: 1px dashed #EFE6D9; font-size: 9pt; vertical-align: middle; }
        .sw-from { color: #8A7A70; width: 36%; }
        .sw-arrow { width: 22px; color: #D97A4A; font-weight: 900; text-align: center; }
        .sw-to { font-weight: 800; }
        .sw-save { width: 110px; text-align: right; font-weight: 900; color: #4F7F4E; }

        /* Таблица по дням и блюда недели */
        .daily { width: 100%; font-size: 8.5pt; border-collapse: separate; border-spacing: 0; }
        .daily th {
            text-align: left;
            font-size: 7.5pt;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8A7A70;
            font-weight: 800;
            padding: 5px 6px;
            border-bottom: 1.5px solid #EFE6D9;
        }
        .daily td { padding: 3.5px 6px; border-bottom: 1px solid #EFE6D9; }
        .daily tr { page-break-inside: avoid; }
        .daily tr.we td { background-color: #FBF6EE; }
        .daily tr.miss td { color: #C9BCB2; font-style: italic; }
        .daily tr.total td { font-weight: 900; background-color: #FBE7D9; border-bottom: 6px solid #FDFBF7; }
        .pill { border-radius: 99px; padding: 0 7px; font-weight: 800; font-size: 8pt; }
        .disclaimer { margin-top: 14px; font-size: 7.5pt; color: #8A7A70; text-align: center; }
    </style>
</head>
<body>
<div id="footer">{{MASCOT}}{{FOOTER_TEXT}}</div>

{{COVER}}
{{EMPTY}}
{{CALENDAR}}
{{CALORIES}}
{{WEIGHT}}
{{ENERGY}}
{{MACROS}}
{{RHYTHM}}
{{TOP}}
{{PATTERNS}}
{{SWAPS}}
{{CATEGORIES}}
{{WATER}}
{{DAILY}}
{{DISHES}}
{{QUALITY}}

<div class="disclaimer">{{pdf.disclaimer}}</div>
</body>
</html>
