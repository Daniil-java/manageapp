<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Calorie Bot Tester</title>
</head>
<body>

<h2>CONFIG</h2>
<label>Base URL:</label>
<input id="baseUrl" value="http://localhost:8080" size="50"><br><br>

<label>User ID:</label>
<input id="userId" value="1"><br><br>

<hr>

<h2>Dish - TEXT</h2>
<input id="dishText" placeholder="Введите текст"><br>
<button onclick="addDishByText()">Send</button>

<hr>

<h2>Dish - PHOTO</h2>
<input type="file" id="photoInput"><br>
<input id="photoCaption" placeholder="Описание (опционально)"><br>
<button onclick="uploadPhoto()">Upload</button>

<hr>

<h2>Dish - VOICE</h2>
<input type="file" id="voiceInput"><br>
<button onclick="uploadVoice()">Upload</button>

<hr>

<h2>Get Today Dishes</h2>
<button onclick="getToday()">Get</button>

<hr>

<h2>Favorites</h2>
<input id="favDishId" placeholder="Dish ID"><br>
<button onclick="saveFavorite()">Save to favorites</button><br><br>

<input id="favId" placeholder="Favorite ID"><br>
<button onclick="useFavorite()">Use favorite</button>
<button onclick="deleteFavorite()">Delete favorite</button><br><br>

<button onclick="getFavorites()">Get favorites</button>

<hr>

<h2>Water</h2>
<input id="waterAmount" placeholder="ml"><br>
<button onclick="addWater()">Add</button>
<button onclick="getWater()">Get today</button>

<hr>

<h2>Weight</h2>
<input id="weight" placeholder="kg"><br>
<button onclick="setWeight()">Set</button>

<hr>

<h2>LOG</h2>
<pre id="log"></pre>

<script>
    function log(data) {
        document.getElementById("log").textContent =
            JSON.stringify(data, null, 2);
    }

    function baseUrl() {
        return document.getElementById("baseUrl").value;
    }

    function userId() {
        return document.getElementById("userId").value;
    }

    // ================= DISH =================

    async function addDishByText() {
        const text = document.getElementById("dishText").value;

        const res = await fetch(`${baseUrl()}/calorie/dishes/text?userId=${userId()}`, {
            method: "POST",
            headers: {"Content-Type": "text/plain"},
            body: text
        });

        log(await res.json());
    }

    async function uploadPhoto() {
        const file = document.getElementById("photoInput").files[0];
        const caption = document.getElementById("photoCaption").value;

        const base64 = await toBase64(file);

        const res = await fetch(`${baseUrl()}/calorie/dishes/photo?userId=${userId()}`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                photoBase64: base64,
                caption: caption
            })
        });

        log(await res.json());
    }

    async function uploadVoice() {
        const file = document.getElementById("voiceInput").files[0];
        const base64 = await toBase64(file);

        const res = await fetch(`${baseUrl()}/calorie/dishes/voice?userId=${userId()}`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                voiceBase64: base64
            })
        });

        log(await res.json());
    }

    async function getToday() {
        const res = await fetch(`${baseUrl()}/calorie/dishes/today?userId=${userId()}`);
        log(await res.json());
    }

    // ================= FAVORITES =================

    async function saveFavorite() {
        const dishId = document.getElementById("favDishId").value;

        const res = await fetch(`${baseUrl()}/favorites/from-dish?userId=${userId()}&dishId=${dishId}`, {
            method: "POST"
        });

        log(await res.json());
    }

    async function useFavorite() {
        const favId = document.getElementById("favId").value;

        const res = await fetch(`${baseUrl()}/favorites/${favId}/use?userId=${userId()}`, {
            method: "POST"
        });

        log(await res.json());
    }

    async function deleteFavorite() {
        const favId = document.getElementById("favId").value;

        const res = await fetch(`${baseUrl()}/favorites/${favId}?userId=${userId()}`, {
            method: "DELETE"
        });

        log("Deleted");
    }

    async function getFavorites() {
        const res = await fetch(`${baseUrl()}/favorites?userId=${userId()}`);
        log(await res.json());
    }

    // ================= WATER =================

    async function addWater() {
        const amount = document.getElementById("waterAmount").value;

        const res = await fetch(`${baseUrl()}/water?userId=${userId()}&amountMl=${amount}`, {
            method: "POST"
        });

        log(await res.json());
    }

    async function getWater() {
        const res = await fetch(`${baseUrl()}/water?userId=${userId()}`);
        log(await res.json());
    }

    // ================= WEIGHT =================

    async function setWeight() {
        const weight = document.getElementById("weight").value;

        const res = await fetch(`${baseUrl()}/weight?userId=${userId()}`, {
            method: "PUT",
            headers: {"Content-Type": "application/json"},
            body: weight
        });

        log(await res.json());
    }

    // ================= UTILS =================

    function toBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });
    }
</script>

</body>
</html>
