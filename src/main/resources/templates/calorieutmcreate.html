<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --padding: 15px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #222222);
            margin: 0;
            padding: var(--padding);
            line-height: 1.5;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        h3 {
            margin-top: 0;
            color: var(--tg-theme-hint-color, #707579);
            font-size: 1.1em;
            text-transform: uppercase;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: var(--tg-theme-link-color, #248bcf);
        }

        input, select, textarea {
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #222222);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--tg-theme-button-color, #248bcf);
        }

        button {
            margin-top: 10px;
            padding: 15px;
            border-radius: 12px;
            border: none;
            background-color: var(--tg-theme-button-color, #248bcf);
            color: var(--tg-theme-button-text-color, #ffffff);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.8;
        }

        .hint {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #707579);
        }
    </style>
</head>
<body>

<div class="container">
    <h3>🔗 Новая UTM-ссылка</h3>

    <div class="form-group">
        <label>Тип владельца</label>
        <select id="ownerType">
            <option value="">Загрузка типов...</option>
        </select>
    </div>

    <div class="form-group">
        <label>Название (Tittle)</label>
        <input type="text" id="tittle" placeholder="Например: Канал Олега">
        <span class="hint">Внутреннее название для списка</span>
    </div>

    <div class="form-group">
        <label>Ссылка/Юзернейм</label>
        <input type="text" id="sourceUrl" placeholder="@my_channel или https://...">
    </div>

    <div class="form-group">
        <label>Описание</label>
        <textarea id="description" rows="2" placeholder="Доп. информация (необязательно)"></textarea>
    </div>

    <button id="submitBtn">Создать и сохранить</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    // 1. Динамическая загрузка типов из твоего контроллера
    async function loadOwnerTypes() {
        const select = document.getElementById('ownerType');
        try {
            const response = await fetch('/calorie/utm/ownertypes');
            if (!response.ok) throw new Error('Ошибка сети');

            const types = await response.json();
            select.innerHTML = ''; // Очищаем "Загрузку..."

            types.forEach(type => {
                const option = document.createElement('option');
                option.value = type;
                // Красивое отображение
                option.textContent = formatTypeName(type);
                select.appendChild(option);
            });
        } catch (error) {
            console.error(error);
            select.innerHTML = '<option value="">Ошибка загрузки</option>';
        }
    }

    function formatTypeName(type) {
        const names = {
            'TG_CHANNEL': '📢 Телеграм-канал',
            'USER': '👤 Пользователь',
            'WEB': '🌐 Веб-сайт'
        };
        return names[type] || type;
    }

    // 2. Отправка данных на бэкенд
    document.getElementById('submitBtn').addEventListener('click', () => {
        const data = {
            ownerType: document.getElementById('ownerType').value,
            tittle: document.getElementById('tittle').value,
            sourceUrl: document.getElementById('sourceUrl').value,
            description: document.getElementById('description').value,
            creatorId: tg.initDataUnsafe?.user?.id || 0
        };

        // Валидация
        if (!data.tittle || !data.sourceUrl) {
            tg.showAlert("Пожалуйста, заполните название и ссылку!");
            return;
        }

        // ОТПРАВКА НАПРЯМУЮ В ТЕЛЕГРАМ
        // Бот получит Update с полем WebAppData
        tg.sendData(JSON.stringify(data));

        // Закрываем Mini App
        tg.close();
    });

    // Запускаем загрузку типов при старте
    loadOwnerTypes();
</script>

</body>
</html>
