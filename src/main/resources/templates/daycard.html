<!DOCTYPE html>
<!--
  Карточка «мой день» (DayCardService → HtmlPdfRenderer.renderPngOrNull): 1080×1350 px, 4:5 — для чатов и ленты.
  XHTML для openhtmltopdf: только закрытые теги, без flex/grid/calc(), вёрстка таблицами, эмодзи монохромные.
  Плейсхолдеры в двойных фигурных скобках — данные, уже экранированные (DayCardService.fillTemplateOrNull).
-->
<html lang="{{LANG}}" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8"/>
    <style>
        @page { size: 1080px 1350px; margin: 0; }
        body {
            margin: 0;
            font-family: "Nunito", "Noto Emoji", "DejaVu Sans";
            color: #3E2723;
            background: #FBF6EE;
        }
        table { border-collapse: collapse; width: 100%; }
        td { padding: 0; vertical-align: middle; }
        .page { padding: 56px 80px 0 80px; }

        .title { font-size: 46px; font-weight: 900; }
        .date { font-size: 32px; font-weight: 700; color: #8A7A70; padding-top: 4px; }
        .mascot { width: 120px; text-align: right; }

        .main {
            margin-top: 40px;
            padding: 16px 56px 36px 56px;
            background: #FFFFFF;
            border-radius: 40px;
            border-right: 6px solid #EFE6D9;
            border-bottom: 6px solid #EFE6D9;
        }
        .kcal-line { line-height: 1; }
        .kcal { font-size: 120px; font-weight: 900; }
        .kcal-unit { font-size: 48px; font-weight: 800; color: #8A7A70; }
        .norm { font-size: 34px; font-weight: 700; color: #8A7A70; padding-top: 10px; }
        .track { height: 30px; background: #EFE6D9; border-radius: 15px; margin-top: 24px; }
        .fill { height: 30px; background: #D97A4A; border-radius: 15px; }

        .macros { margin-top: 36px; }
        .macro-label { font-size: 32px; font-weight: 800; padding-bottom: 10px; }
        .macro-value { font-size: 32px; font-weight: 700; color: #8A7A70; text-align: right; padding-bottom: 10px; }
        .macro-track { height: 20px; background: #EFE6D9; border-radius: 10px; }
        .macro-fill { height: 20px; border-radius: 10px; }
        .macro-gap { height: 16px; }
        .p { background: #4F7F4E; }
        .f { background: #C96A3A; }
        .c { background: #D9A441; }

        .chips { margin-top: 32px; }
        .chip-gap { width: 24px; }
        .chip-cell { width: 448px; padding: 0; }
        .chip {
            padding: 28px 32px;
            background: #FBE7D9;
            border-radius: 32px;
            font-size: 36px;
            font-weight: 800;
        }

        .footer { margin-top: 32px; padding: 30px 44px; background: #3E2723; border-radius: 32px; color: #FDFBF7; }
        .footer-title { font-size: 34px; font-weight: 800; }
        .footer-link { font-size: 30px; font-weight: 700; color: #F6D9C2; padding-top: 10px; }
        .footer-bonus { font-size: 28px; font-weight: 700; color: #C9BCB2; padding-top: 6px; }
    </style>
</head>
<body>
<div class="page">
    <table>
        <tr>
            <td>
                <div class="title">{{TITLE}}</div>
                <div class="date">{{DATE}}</div>
            </td>
            <td class="mascot">{{MASCOT}}</td>
        </tr>
    </table>

    <div class="main">
        <div class="kcal-line"><span class="kcal">{{KCAL}}</span> <span class="kcal-unit">{{KCAL_UNIT}}</span></div>
        <div class="norm">{{NORM}}</div>
        {{KCAL_BAR}}

        <table class="macros">
            {{MACROS}}
        </table>
    </div>

    <table class="chips">
        <tr>
            <td class="chip-cell"><div class="chip">🔥 {{STREAK}}</div></td>
            <td class="chip-gap"></td>
            <td class="chip-cell"><div class="chip">🍽 {{DISHES}}</div></td>
        </tr>
    </table>

    <div class="footer">
        <div class="footer-title">{{FOOTER}}</div>
        <div class="footer-link">{{LINK}}</div>
        <div class="footer-bonus">{{BONUS}}</div>
    </div>
</div>
</body>
</html>
